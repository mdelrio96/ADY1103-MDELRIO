# Exporters de andys-plataforma.
#   node-exporter      métricas del sistema operativo de la EC2   :9100
#   postgres-exporter  métricas de la base de datos central       :9187
#
# Las credenciales de la base se leen del .env de esta carpeta, que es una copia
# del .env de la plataforma (Casos/AndysMotors/demo/.env):
#   cp ~/ADY1103-Activities/Casos/AndysMotors/demo/.env .env
services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host      # mide la EC2, no el contenedor
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@andys-postgres:5432/${DB_NAME}?sslmode=disable"
    ports:
      - "9187:9187"
    networks: [andys]

networks:
  andys:
    # Red de la plataforma: Compose la crea como <carpeta>_andys, y la carpeta es "demo".
    external: true
    name: demo_andys
