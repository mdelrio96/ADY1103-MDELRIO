# EP2 · CI de validación en cada push/PR que toque la infraestructura:
# terraform fmt + validate de ambas capas, sin credenciales ni estado.
# Evita que llegue a main un .tf roto antes de gastar una sesión del lab.

name: EP2 · Validar Terraform

on:
  push:
    paths: ["EP2/infra/**", ".github/workflows/ep2-*.yaml"]
  pull_request:
    paths: ["EP2/infra/**", ".github/workflows/ep2-*.yaml"]

permissions:
  contents: read

jobs:
  monitoreo:
    name: monitoreo · fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - working-directory: EP2/infra/monitoreo
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  plataforma:
    name: plataforma · validate (código del docente + backend propio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: asanchezo-duoc/ADY1103-Activities
          ref: ${{ vars.UPSTREAM_REF || '8add424f7503f78527ad44b627f4f2e4decd666b' }}
          path: upstream
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: |
          terraform fmt -check EP2/infra/plataforma
          cp EP2/infra/plataforma/backend.tf upstream/Casos/AndysMotors/infra/backend.tf
          cp EP2/infra/plataforma/plataforma.tfvars upstream/Casos/AndysMotors/infra/ep2.auto.tfvars
      - working-directory: upstream/Casos/AndysMotors/infra
        run: |
          terraform init -backend=false -input=false
          terraform validate
